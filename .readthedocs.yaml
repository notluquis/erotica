# Read the Docs build config — https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Explicit build so the source dir is unambiguously docs/ (RTD otherwise
    # invoked sphinx-build with the repo root as source and failed to find conf.py).
    build:
      html:
        - python -m sphinx -T -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  # fail_on_warning: true   # enable once numpydoc docstring warnings are clean

# uv install (2024+ RTD feature) — much faster than pip for the dep tree.
python:
  install:
    - method: uv
      command: pip
      path: .
      extras:
        - docs

# Surface the user guide over internal design notes in on-site search.
search:
  ranking:
    guides/*: 5
    api/*: 3
    design-notes/*: -2
