# Static analysis of the CI configuration itself.
#
# WHY THIS EXISTS AND WHY IT IS NOT DECORATION
# --------------------------------------------
# `publish.yml` holds `id-token: write` and exchanges a GitHub OIDC identity for a PyPI upload
# token. That is the most privileged thing in this repository: a workflow-injection or an
# over-broad trigger there does not leak a secret, it lets someone publish under this project's
# name. Nothing in `pytest` or `sphinx` looks at that.
#
# zizmor is the GitHub Actions audit tool from the same people who maintain PyPI's own tooling.
# It catches the failure modes that are invisible in review: template injection through
# `${{ github.event.* }}`, `pull_request_target` used with a checkout of untrusted code,
# credential persistence, and excessive `permissions`.
#
# It runs on a schedule as well as on push, because a workflow that was safe when written can
# become unsafe when an action it calls changes what it does.

name: Security

on:
  push:
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  pull_request:
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 6 1 * *"     # monthly, so a newly-published advisory is noticed
  workflow_dispatch:

permissions: {}             # default to nothing; each job asks for what it needs

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to upload SARIF into the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # zizmor flags this exact thing; do not model the bad habit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade zizmor
      - name: Audit
        run: zizmor --format sarif . > zizmor.sarif
        continue-on-error: true        # report findings, do not block the release path on them

      # `continue-on-error` es deliberado —los hallazgos de zizmor no deben frenar un release— pero
      # sin esto el check queda verde diga lo que diga el SARIF, y verde se lee como "sin
      # hallazgos". Es un guardia que no puede fallar: imprime exactamente lo mismo pase lo que
      # pase. El 2026-08-23 este repo tenía 27 alertas abiertas, 20 de severidad `error`, mientras
      # la corrida de seguridad figuraba en verde y yo la citaba como evidencia de que todo estaba
      # bien salvo un workflow. No bloquea; habla.
      - name: Lo que encontró, en el resumen del job
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          f = pathlib.Path("zizmor.sarif")
          if not f.exists():
              print("## zizmor\n\nNo se produjo SARIF: la auditoría no llegó a correr.")
              raise SystemExit
          runs = json.loads(f.read_text()).get("runs", [])
          rules = {r["id"]: r for run in runs for r in run["tool"]["driver"].get("rules", [])}
          c = collections.Counter()
          for run in runs:
              for res in run.get("results", []):
                  lvl = res.get("level") or rules.get(res.get("ruleId"), {}).get(
                      "defaultConfiguration", {}).get("level", "note")
                  c[(lvl, res.get("ruleId"))] += 1
          print("## zizmor\n")
          if not c:
              print("Sin hallazgos.")
          else:
              print(f"**{sum(c.values())} hallazgos.** Este check no puede ponerse rojo "
                    "(`continue-on-error`), así que su verde sólo dice que corrió.\n")
              print("| severidad | n | regla |\n|---|---|---|")
              for (lvl, rid), n in sorted(c.items(), key=lambda x: (-x[1], x[0])):
                  print(f"| {lvl} | {n} | `{rid}` |")
          PY
      - uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85  # v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
