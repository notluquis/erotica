name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        # bayes/isochrone-sampling tests self-skip without the [bayes] extra.
        run: pytest -q
