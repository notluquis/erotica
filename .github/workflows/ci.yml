name: CI

on: [push, pull_request]

jobs:
  # Core suite on every supported Python, WITHOUT the `bayes` extra. That omission is
  # the point: it is the only thing enforcing that `import erotica` works with pymc,
  # pytensor, arviz, numpyro, jax and blackjax all absent.
  #
  # The matrix must match `requires-python` in pyproject.toml. It said 3.11/3.12/3.13
  # while requires-python had moved to >=3.13, so those two legs could not install the
  # package at all -- a red CI caused by the config disagreeing with itself.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q

  # The Bayesian paths produce every published number, and until 2026-07-27 no
  # test had ever sampled a PyMC model -- the suite monkeypatched the sampler
  # away and CI installed only `.[dev]`, so a broken default backend went
  # unnoticed. This job installs the extra so those tests actually execute
  # rather than skipping, and reports coverage.
  test-bayes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .[dev,bayes]
      - name: Fail if the bayes extra did not actually install
        run: python -c "import pymc, arviz; print('pymc', pymc.__version__, '| arviz', arviz.__version__)"
      - run: pytest -q --cov=erotica --cov-report=term-missing

  # Documentation. Added 2026-08-04, because until then NOTHING in CI built the docs: they were
  # rendered only by Read the Docs, whose `.readthedocs.yaml` has `fail_on_warning` commented out
  # with the note "enable once numpydoc docstring warnings are clean". So a broken autodoc target,
  # a bad cross-reference or an unparseable RST block reached `main` and was discovered, if at all,
  # by a reader.
  #
  # This does NOT turn on fail_on_warning globally -- that is a separate, larger cleanup. It fails
  # on the errors that make the build wrong rather than untidy, and it PRINTS the warning count so
  # the number is visible and can be driven down deliberately instead of by surprise.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # `docs` alone is not enough: autodoc imports the package, and the analysis modules import
      # pymc at module scope in places, so a docs-only environment fails on import rather than on
      # documentation. This is the same coupling that keeps `bayes` in the test-bayes job.
      - run: pip install -e .[docs,bayes]
      - name: Build HTML, failing on errors
        run: |
          python -m sphinx -T -b html docs docs/_build/html 2>&1 | tee /tmp/sphinx.log
          echo "--- warning count ---"
          grep -c "WARNING" /tmp/sphinx.log || true
      - name: Check that every documented API target actually resolved
        run: |
          python -m sphinx -T -b linkcheck docs docs/_build/linkcheck 2>&1 | tail -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: error
