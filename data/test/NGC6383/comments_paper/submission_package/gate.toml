# Configuracion de NGC 6383 (aa52082-24) para tools/manuscript_gate.py.
#
# Todos los valores aca son copia EXACTA de las constantes y literales que gate.py traia antes del
# 2026-09-15 (refactor TOOL-gate-generalize, hub open-threads.md). Rutas relativas a este fichero;
# `~` se expande. Las secciones sin nombre de check propio ("kb", "linters", etc.) usan el nombre
# corto -- el de la funcion menos el prefijo `c_` -- que es tambien el vocabulario de
# `not_applicable`.

tex = "clean_source/aa52082-24.tex"
# `marked` se retiro 2026-09-15 (paso 5 del pase post-aceptacion): el editor pidio version limpia
# unicamente, y no hay respuesta al arbitro en esta ronda -- el paper ya fue aceptado. c_marked_fresh,
# c_strip y los checks que leen LETTERS para vigilar lo que se SUBE (no lo que se conserva como
# registro) pasan a not_applicable mas abajo. `letters` se mantiene: c_posterior y c_copies siguen
# vigilando el contenido y la sincronia interna de las cartas de ronda 3, que quedan como registro en
# letters/ y referee_round3/ (no se borran -- "son registro"). letters[0] seguia siendo la carta de
# presentacion; ya no la usa c_cds_claim (n/a), pero check_posterior_claims.py la sigue leyendo.
letters = [
    "letters/cover_letter_round3.txt",
    "letters/response_to_referee_round3.txt",
]
cds_dat = "../cds_final/table2.dat"
cds_readme = "../cds_final/ReadMe"
local = "gate_local.py"

[posterior]
script = "check_posterior_claims.py"

[register]
# Phrases that are about how the paper argues rather than about the cluster, or that instruct
# the reader instead of stating something. Every one was written into this manuscript during the
# 2026-08 review and removed in Sect. 69 of CHANGES.md; the list is what that pass found, not a
# general style opinion. It applies to the manuscript ONLY -- a response letter is legitimately
# about how one argues, and "we now state", "our argument" belong there.
phrases = [
    "for our argument",
    "should be read as such",
    "should be read accordingly",
    "rather than afterwards",
    "deliberately kept apart",
    "we make it from",
    "requires an argument",
    "it is worth noting",
    "it should be emphasized",
    "it should be emphasised",
    "needless to say",
    "as we have seen",
    "in our opinion",
    "we note two consequences",
]

[overclaim]
# The letter may not assert more strongly than the manuscript. Not a style rule: a referee reads
# both, and a letter that says the wider windows "demonstrably" admit contamination sends them to
# a Sect. 3.3 that says the behavior "is consistent with" it and would require further diagnostics
# to settle. The manuscript hedges there on purpose. Each is a claim of proof; if one is ever true
# of this analysis it belongs in the manuscript first.
words = [
    "demonstrably",
    "conclusively",
    "definitively",
    "unambiguously",
    "artificially",
    "indisputably",
    "proves that",
    "rules out",
]

[spelling]
# US spelling, because the cover letter promises the editor exactly that. "towards", "whilst" and
# "amongst" are included because A&A house style prefers the shorter forms.
british = [
    "analyse", "analysed", "analysing", "characterise", "characterised", "characterisation",
    "normalise", "normalised", "normalisation", "minimise", "maximise", "optimise", "optimised",
    "organise", "organised", "organisation", "recognise", "summarise", "summarised",
    "emphasise", "emphasised", "parameterise", "parameterised", "marginalise", "marginalised",
    "utilise", "utilised", "generalise",
    "colour", "colours", "coloured", "behaviour", "favour", "neighbour", "neighbours",
    "neighbouring", "labour",
    "centre", "centres", "centred", "metre", "fibre",
    "modelling", "modelled", "labelling", "labelled", "travelled", "cancelled", "signalled",
    "fuelled", "totalled",
    "catalogue", "catalogues", "catalogued", "dialogue", "analogue", "grey", "programme",
    "defence", "licence", "ageing", "practise", "artefact", "artefacts", "sulphur", "aluminium",
    "whilst", "amongst", "towards",
]
# The two licensed exceptions: CDS mandates the wording of the VizieR acknowledgement, and the
# cover letter quotes the word to declare it.
exceptions = ["VizieR", '"catalogue"']

[paraphrase]
# One fact, one phrasing. The 70 arcmin window's virtue is stated in six places -- abstract,
# Sect. 5, Appendix D, Sect. 8.4, the conclusions and Fig. D.1's caption -- and each variant below
# was actually written into one of them and removed, because it claims more than Appendix D
# allows. A closed list of variants actually removed, not a style opinion.
variants = [
    "fully encloses the fitted profile",
    "fully encloses the profile",
    "genuine background annulus",
    "genuine background level",
    "true background annulus",
    "real background beyond the cluster",
    "constrain the field background",
    "the field background beyond",
]
canonical = "fitted background annulus"

[copies]
# Los tres pares que comparaban clean_source/ contra marked_changes/ (cites.bib, aa.cls, aa.bst --
# la copia que dejaba a latexdiff compilar standalone) se quitaron 2026-09-15 junto con `marked`:
# marked_changes/ sigue en el arbol como registro, pero ya no se reconstruye ni se compara.
pairs = [
    ["letters/cover_letter_round3.txt", "../referee_round3/cover_letter_round3.txt"],
    ["letters/response_to_referee_round3.txt", "../referee_round3/response_letter.txt"],
    ["../cds_final/ReadMe", "cds/ReadMe"],
]

[cds_claim]
# Ronda 3: el autor confirmo (2026-09-14) que en ronda 2 reemplazo en NESTOR el dataset por
# aa52082-24_cds_members.zip. Esa es ahora la referencia de lo que NESTOR tiene.
submitted_zip = "../_legacy/cds_round2_submitted/cds.zip"

[linters]
# El 8 es el largo de guion. DashExcpt en .chktexrc NO cubre ninguno de estos dos casos (ver el
# comentario de ese fichero: son "dos residuos conocidos" que se aceptan aca, por contenido, en
# vez de alli por regex) -- por eso viven en accepted_dash y no en DashExcpt.
# "Sh 2-012" es el designador Sharpless con un digito a cada lado del guion (NumDash lo trata
# como rango numerico y pide "--"; DashExcpt es alfabetico y no aplica). Cinco sitios: L31, L48,
# L398 (x2), L400.
# El segundo es \keywords{...}: la separacion " -- " entre items es la sintaxis exigida por el
# house style de A&A para esa macro (todo articulo A&A la usa igual), y chktex la lee como un
# guion largo con espacios alrededor que "deberia" ser \emph{---} (guion de parentesis). Cambiarla
# violaria el house style, asi que se acepta el tramo completo de L37 (una sola cadena cubre los
# cinco guiones de esa linea, revisado 2026-09-15: c_linters sigue en verde con los 10 avisos
# crudos que deja chktex, todos aceptados).
accepted_dash = [
    "Sh 2-012",
    "photometric -- parallaxes -- proper motions -- stars: distances -- stars: pre-main sequence -- open clusters",
]

[kb]
root = "~/phd/kb"
notes = [
    "papers/2024arXiv240509145P.md",
    "objects/ngc-6383.md",
]
# [label, regex en el tex (adoptado), regex en la nota (superado)]. Regex como literal strings
# ('...'), sin doble escape.
anchors = [
    ["R_t", 'R_t = 54\^\{\+7\}_\{-11\}', 'R_t\s*40\.4'],
    ["R_c", '1\.96\^\{\+0\.19\}_\{-0\.16\}', 'R_c\s*1\.95'],
    ["age/t_rh", '0\.14', 't_rh\s*~\s*0\.19'],
]

[deliverables]
# El primer par es el PDF TRACKEADO del arbol (comparado contra el build fresco de _gate_build/);
# el segundo es la copia que de verdad se sube. Las tres filas "marcado" (marked_changes/aanda_marked.pdf,
# aanda_revised_marked.pdf, aa52082-24_marked_changes.pdf) se quitaron 2026-09-15: ya no hay diff
# marcado que subir, ver `not_applicable` mas abajo.
pairs = [
    ["limpio", "clean_source/aa52082-24.pdf"],
    ["limpio", "aa52082-24_revised_clean.pdf"],
]

[zip]
path = "aa52082-24_source.zip"

[overfull]
# El marcado se quito 2026-09-15 junto con el resto del diff marcado; DOCS ahora solo trae "limpio".
# Conteo exacto, no umbral.
allowed = { limpio = 0 }

[not_applicable]
# Retirados 2026-09-15 (paso 5 del pase post-aceptacion): el editor pide version limpia unicamente
# y este paper ya fue aceptado, asi que no hay respuesta al arbitro ni diff marcado que subir en
# esta ronda. Los siete checks de abajo dependian de esa ranura de subida, no del contenido del
# manuscrito -- las letras y marked_changes/ se conservan en el arbol como registro (no se borran),
# y c_posterior + c_copies (que tambien leen LETTERS) siguen activos porque vigilan el contenido y
# la sincronia interna de ese registro, no una subida.
letter_numbers = "no hay carta de ronda 4 que subir; letters/ queda como registro de ronda 3, sin obligacion de no divergir del manuscrito post-aceptacion"
overclaim = "idem: nada que comparar contra una carta que no se envia"
dropped_symbols = "idem: la conversion a texto plano para NESTOR ya no aplica"
section_refs = "idem: ninguna carta cita secciones del manuscrito para esta ronda"
marked_fresh = "no hay diff marcado que subir; marked_changes/ se conserva pero no se reconstruye"
strip = "idem: nada que limpiar en un diff que no se genera"
cds_claim = "el CDS ahora se envia directo al CDS, no via NESTOR (confirmado por el autor 2026-09-14); no hay carta que declare cambios en el paquete a un editor que ya no lo recibe por esa via"
