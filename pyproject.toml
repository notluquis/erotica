[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erotica"
version = "0.0.1"
description = "EROTICA: Estimation, Recovery & Optimization, together with Inference, for Cluster Analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Lucas Pulgar-Escobar", email = "lescobar2019@udec.cl"},
  {name = "Nicolás Henríquez Salgado"}
]
keywords = ["astronomy", "clustering", "gaia", "star-clusters", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
# Floors match what actually resolves on the supported Pythons. They were previously numpy>=1.23,
# astropy>=6 and similar — versions with no build for 3.13+, so they advertised support that could
# not be installed. See environment.yml for the resolved set.
dependencies = [
  "hdbscan>=0.8.44",
  "optuna>=4.9",
  "numpy>=2.4",
  "scipy>=1.18",
  "pandas>=3.0",
  "astropy>=8",
  "scikit-learn>=1.9",
  "tqdm>=4.65",
  "matplotlib>=3.11",
  "dill>=0.3.8",
  "adjusttext>=1.4",
  "gaiadr3-zeropoint>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4.0",
  "black>=23.0",
  "isort>=5.12",
  "flake8>=6.0",
  "mypy>=1.5",
  "pre-commit>=3.0",
  "nbstripout>=0.7",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]
examples = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "seaborn>=0.12",
]
bayes = [
  "pymc>=6",
  "arviz>=1",
  "xarray>=2023",
  # numpyro is the NUTS backend the validation sweeps use: measured 2.71x faster than the
  # default PyTensor NUTS on the unbinned EFF fit, with |d gamma| = 0.00006 between them.
  # Same algorithm, different substrate -- see tools/validation/pymc_blackjax_progress_bar_bug.md.
  "numpyro>=0.15",
  # blackjax is declared but is NOT currently usable as a nuts_sampler: it raises
  # TypeError: kernel() got an unexpected keyword argument 'progress_bar'. Traced to a
  # kwarg-ordering bug in pymc/sampling/jax.py that is still present on pymc main as of
  # 2026-08-02, and verified in the RELEASED 6.2.0 source, so upgrading does not fix it.
  # Upstream: pymc-devs/pymc#8367, fix pending in PR #8373. (An earlier version of this comment
  # cited #7049 — wrong: that is a 2023 issue about progress bars under pmap, closed in a week.)
  "blackjax>=1",
  "fast-histogram>=0.11",
]
asteca = [
  "asteca>=0.6",
]
selection = [
  "gaiaunlimited>=0.3",
  "hr-selection-function>=1.0",
]
paper = [
  "pymc>=6",
  "arviz>=1",
  "xarray>=2023",
  "numpyro>=0.15",
  "blackjax>=1",
  "asteca>=0.6",
  "seaborn>=0.12",
  "fast-histogram>=0.11",
]

[project.urls]
Homepage = "https://github.com/notluquis/erotica"
Repository = "https://github.com/notluquis/erotica"
Issues = "https://github.com/notluquis/erotica/issues"
Changelog = "https://github.com/notluquis/erotica/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = [
  "clustering",
  "cluster_analysis",
  "data_loader",
  "data_preprocessor",
  "utils",
]

[tool.setuptools.packages.find]
include = ["erotica*"]
exclude = ["legacy*", "tests*", "notebooks*", "backups*", "data*"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "build/",
    "dist/",
    "legacy/",
    "tests/",
    "examples/",
    "docs/",
]
