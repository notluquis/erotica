[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-cluster-analysis"
version = "0.0.1"
description = "COSMIC: Characterization Of Star clusters using Machine-learning Inference and Clustering"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Lucas Pulgar-Escobar", email = "lescobar2019@udec.cl"},
  {name = "Nicolás Henríquez Salgado"}
]
keywords = ["astronomy", "clustering", "gaia", "star-clusters", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "hdbscan>=0.8.40",
  "optuna>=4.5.0",
  "numpy>=1.23",
  "scipy>=1.10",
  "pandas>=1.5",
  "astropy>=6",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "dill>=0.3.8",
  "adjusttext>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4.0",
  "black>=23.0",
  "isort>=5.12",
  "flake8>=6.0",
  "mypy>=1.5",
  "pre-commit>=3.0",
  "nbstripout>=0.7",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=1.3",
  "sphinx-autodoc-typehints>=1.24",
  "myst-parser>=2.0",
  "jupyter-book>=0.15",
]
examples = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "seaborn>=0.12",
]
bayes = [
  "pymc>=5",
  "arviz>=0.16",
  "xarray>=2023",
  "blackjax>=1",
]
asteca = [
  "asteca>=0.6",
]
paper = [
  "pymc>=5",
  "arviz>=0.16",
  "xarray>=2023",
  "blackjax>=1",
  "asteca>=0.6",
  "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/notluquis/COSMIC"
Repository = "https://github.com/notluquis/COSMIC"
Issues = "https://github.com/notluquis/COSMIC/issues"
Changelog = "https://github.com/notluquis/COSMIC/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = [
  "clustering",
  "cluster_analysis",
  "data_loader",
  "data_preprocessor",
  "utils",
]

[tool.setuptools.packages.find]
include = ["cosmic*"]
exclude = ["legacy*", "tests*", "notebooks*", "backups*", "data*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "build/",
    "dist/",
    "legacy/",
    "tests/",
    "examples/",
    "docs/",
]
