[build-system]
# setuptools>=77 is the floor, not a round number: PEP 639 license expressions (the bare SPDX
# string in `license` below, with no accompanying classifier) are only understood from
# setuptools 77.0.0 onward -- older setuptools raises `ValueError: invalid pyproject.toml config:
# project.license` on this exact file. Verified against setuptools' own migration guide
# (setuptools.pypa.io/en/latest/userguide/license_migration.html) and issue #4903.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erotica"
version = "0.2.0"
description = "EROTICA: Estimation, Recovery & Optimization, together with Inference, for Cluster Analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Lucas Pulgar-Escobar", email = "lescobar2019@udec.cl"},
]
keywords = ["astronomy", "clustering", "gaia", "star-clusters", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
# Floors match what actually resolves on the supported Pythons. They were previously numpy>=1.23,
# astropy>=6 and similar — versions with no build for 3.13+, so they advertised support that could
# not be installed. See environment.yml for the resolved set.
dependencies = [
  "hdbscan>=0.8.44",
  "optuna>=4.9",
  "numpy>=2.4",
  "scipy>=1.18",
  "pandas>=3.0",
  "astropy>=8",
  "scikit-learn>=1.9",
  "tqdm>=4.65",
  "matplotlib>=3.11",
  "dill>=0.3.8",
  "adjusttext>=1.4",
  "gaiadr3-zeropoint>=0.1.0",
]

[project.optional-dependencies]
# ruff replaces black + isort + flake8 (one tool, orders of magnitude faster). They were all
# declared here and run by no hook and no CI job; see .pre-commit-config.yaml. mypy stays
# declared but is not wired to a hook -- its config is strict and the package has never been run
# against it, so it needs a triaged pass rather than a surprise gate.
dev = [
  "pytest>=8",
  "pytest-cov>=4.0",
  "ruff>=0.14",
  "mypy>=1.5",
  "pre-commit>=3.0",
  "nbstripout>=0.7",
]
# External oracles. Kept OUT of `dev` on purpose: these exist only so a test can check this
# package against an INDEPENDENT implementation, and `pip install --no-deps` is the point --
# ocelot's full dependency chain pulls healpy, dustmaps, gaiaunlimited and astromet, none of
# which this package needs. `tests/test_structure.py::test_king_profile_matches_ocelot_king62`
# is importorskip-gated, so without this extra it SKIPS silently, which is how
# `tests/CLAUDE.md` came to advertise a King62 cross-validation that did not exist for months.
# Declaring it is what makes the skip visible as a choice instead of an accident.
oracles = [
  "ocelot>=0.4.10",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]
examples = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "seaborn>=0.12",
]
bayes = [
    # `pytensor` viene por `pymc`, pero `_isochrone.py` lo importa DIRECTO y sin guardia
    # (lineas 680, 717, 907): lo que se importa se declara, no se hereda.
    #
    # >=3.2.4, no bare: pytensor#2308 (numba CauchyRV computes (loc+z)/scale instead of
    # loc+scale*z, corrupting pm.HalfCauchy's DRAWS -- logp and NUTS posteriors are unaffected)
    # is fixed by PR #2309 in rel-3.2.4 (2026-08-01). structure.py's King/EFF/corona model
    # builders call pm.HalfCauchy directly (F1, closed 2026-09-24) and raise RuntimeError below
    # this floor rather than silently reproducing the bug -- see
    # `erotica/analysis/structure.py::_assert_pytensor_cauchy_fixed` and
    # `docs/design-notes/decisions.md` (2026-09-24 entry).
    "pytensor>=3.2.4",
    # >=6.2: the first pymc release whose OWN pytensor pin (`pytensor<3.3,>=3.2.2`) admits
    # 3.2.4; pymc 6.0.1/6.1.0 pin pytensor below the fix and cannot be installed alongside it.
    # Verified against `pypi.org/pypi/pymc/<ver>/json` -> info.requires_dist, 2026-09-24.
    "pymc>=6.2",
    # `_assert_pytensor_cauchy_fixed` (structure.py) imports `packaging.version.Version` inside a
    # function, not at module level, but `tools/validation/check_declared_deps.py` still requires
    # anything imported to be declared somewhere -- it was missing entirely from this file.
    "packaging",
  # >=1.2, not >=1: arviz 1.1.0 pins arviz-plots<1.2, whose __init__ does
  # `mplstyle.core.USER_LIBRARY_PATHS.append(...)`, and `matplotlib.style.core` is gone in the
  # matplotlib>=3.11 this package requires. Measured 2026-09-25 in a clean venv: arviz 1.1.0 +
  # matplotlib 3.11.0 -> `import arviz` raises AttributeError; arviz 1.2.0 imports. A
  # `--resolution lowest-direct` install of `.[dev,bayes]` picked exactly 1.1.0. environment.yml
  # already said >=1.2.
  "arviz>=1.2",
  # >=2024.11, not >=2023: erotica/analysis/identifiability.py builds an `xr.DataTree`, which
  # only exists from xarray 2024.10; arviz-base already requires >=2024.11 transitively.
  "xarray>=2024.11",
  # numpyro is the NUTS backend the validation sweeps use: measured 2.71x faster than the
  # default PyTensor NUTS on the unbinned EFF fit, with |d gamma| = 0.00006 between them.
  # Same algorithm, different substrate -- see tools/validation/pymc_blackjax_progress_bar_bug.md.
  #
  # >=0.21, not >=0.15: numpyro does not cap jax, so an old numpyro is installed next to the
  # current jax and fails on import. Measured 2026-09-25 against jax 0.11.2: 0.15.0 raises
  # `cannot import name 'host_callback' from 'jax.experimental'`, 0.16.1-0.18.0 `pjit_p`,
  # 0.19.0-0.20.0 `xla_pmap_p`; 0.21.0 is the first that imports. environment.yml said >=0.21.
  "numpyro>=0.21",
  # blackjax is declared but is NOT currently usable as a nuts_sampler: it raises
  # TypeError: kernel() got an unexpected keyword argument 'progress_bar'. Traced to a
  # kwarg-ordering bug in pymc/sampling/jax.py that is still present on pymc main as of
  # 2026-08-02, and verified in the RELEASED 6.2.0 source, so upgrading does not fix it.
  # Upstream: pymc-devs/pymc#8367, fix pending in PR #8373. Re-checked 2026-09-25: #8367 still
  # open, #8373 still unmerged, and `pymc/sampling/jax.py` is byte-identical in 6.2.0, 6.3.2 and
  # main. A SECOND break sits behind the first: jax.py:280 calls
  # `blackjax.progress_bar.gen_scan_fn(...)`, and since blackjax 1.6 `blackjax.progress_bar` is a
  # function with no such attribute (checked on 1.6.2) -- fixing the kwarg order alone would not
  # be enough. The issue reports blackjax <= 1.5 as working. (An earlier version of this comment
  # cited #7049 — wrong: that is a 2023 issue about progress bars under pmap, closed in a week.)
  #
  # >=1.2, not >=1: blackjax 1.0.0 and 1.1.0 import `jax.experimental.host_callback`, gone from
  # current jax, and fail on import; 1.2.0 imports (measured against jax 0.11.2, 2026-09-25).
  "blackjax>=1.2",
  "fast-histogram>=0.11",
  # ArviZ 1.x ships NO netCDF engine of its own. Without one, InferenceData.to_netcdf raises
  # "cannot write NetCDF files with format='NETCDF4' because none of the suitable backend
  # libraries (netCDF4, h5netcdf) are installed" -- which is every provenance sidecar and every
  # stored trace. This was added to environment.yml on 2026-08-02 and NOT here, and CI installs
  # from this file, so test-bayes was red ever since. Keep the two files in step.
  #
  # The [h5py] extra is load-bearing and a bare "h5netcdf" is NOT enough: h5py is an OPTIONAL
  # extra of h5netcdf, not a dependency, so `pip install h5netcdf` yields an engine with no
  # backend and the failure becomes "No module named 'h5py', backend not available". The first
  # version of this line omitted it and CI stayed red for exactly that reason.
  "h5netcdf[h5py]>=1.3",
]
# Pre-main-sequence classification. Imported with a guard and an ImportError that gives install
# instructions (`_sagitta.py`). NOT declared as an installable extra: a `sagitta = [...]` entry
# here existed briefly (2026-08-26 to 2026-09-22) as `["sagitta @ git+https://github.com/
# hutchresearch/Sagitta.git"]`, and PyPI's own upload validator rejects it -- verified empirically
# via the v0.2.0 TestPyPI rehearsal, HTTP 400: "Can't have direct dependency: sagitta @
# git+https://github.com/hutchresearch/Sagitta.git ; extra == 'sagitta'". A package with a direct
# URL requirement in ANY extra cannot be uploaded to PyPI or TestPyPI at all, not just for that
# extra, which is why it is removed rather than kept for users who don't need it. A same-named
# `sagitta` package (1.2.3) does exist on PyPI from the same authors/repo, but this integration
# (`_sagitta.py`'s `sagitta.data_tools.DataTools` / `sagitta.sagitta.SagittaPipeline` calls) was
# written and verified against the git HEAD, and the PyPI release's internal API was not checked
# against it -- do not add it back as a bare `sagitta>=...` requirement without first verifying
# `_sagitta.py` against an actual install of that package.

asteca = [
  # >=0.7, NOT >=0.6. The published benchmark table (tools/validation/benchmark_erotica_vs_asteca.py)
  # was measured against asteca 0.7.0, and it is the competing method's own numbers -- the
  # `asteca_fastmp` row is the baseline every EROTICA claim is stated relative to.
  #
  # The floor is load-bearing precisely BECAUSE the API did not change: 0.6.9 exposes the same
  # Cluster.get_center / get_nmembers / Membership.fastmp surface, so it runs to completion, raises
  # nothing, and silently produces a DIFFERENT baseline. There is no failure signal to catch it.
  # `>=0.6` therefore admitted an environment in which the paper's central table cannot be
  # reproduced and would appear to reproduce with different numbers. Raised 2026-08-04.
  "asteca>=0.7",
]
selection = [
  "gaiaunlimited>=0.3",
  "hr-selection-function>=1.0",
]
paper = [
  # Same floors and the same reason as [bayes]: this extra regenerates the King/EFF/corona
  # figures, calling the same _king_model / _eff_model / _king_corona_model builders, so an
  # unpinned pytensor here would let the pytensor#2308 CauchyRV bug back in for exactly the
  # numbers that get published.
  "pytensor>=3.2.4",
  "pymc>=6.2",
  "packaging",  # _assert_pytensor_cauchy_fixed imports packaging.version -- see [bayes]
  "arviz>=1.2",  # see [bayes]: arviz 1.1 cannot be imported with matplotlib>=3.11
  "xarray>=2024.11",  # see [bayes]: xr.DataTree
  "numpyro>=0.21",  # see [bayes]: older numpyro cannot import with current jax
  "blackjax>=1.2",  # see [bayes]: 1.0/1.1 cannot import with current jax
  # >=0.7, the same floor as the [asteca] extra and for its reason: 0.6.9 runs with the same API
  # and silently yields a different `asteca_fastmp` baseline. This line said >=0.6 while [asteca]
  # had been raised on 2026-08-04, so `pip install erotica[paper]` could still pick 0.6.9.
  "asteca>=0.7",
  "seaborn>=0.12",
  "fast-histogram>=0.11",
  # Same reason as in [bayes], including the [h5py] extra: ArviZ 1.x ships no netCDF engine,
  # and h5netcdf without a backend is still no engine. This extra regenerates the paper
  # figures, so it hits the failure on the first fit.
  "h5netcdf[h5py]>=1.3",
]

[project.urls]
Homepage = "https://github.com/notluquis/erotica"
Repository = "https://github.com/notluquis/erotica"
Issues = "https://github.com/notluquis/erotica/issues"
Changelog = "https://github.com/notluquis/erotica/blob/main/CHANGELOG.md"

[tool.setuptools]
# NOT shipped: the five bare top-level shims (clustering, cluster_analysis, data_loader,
# data_preprocessor, utils). They were declared here, so `pip install erotica` dropped
# `utils.py`, `clustering.py` and `data_loader.py` UNNAMESPACED into site-packages -- and
# `utils` in particular is one of the most collision-prone names on PyPI. Installing a module
# called `utils` into a user's environment can shadow their own or another package's.
#
# They are 81 lines total and are pure re-export shims (`from erotica.utils.utils import
# compare_datasets`). Nothing in this repository imports them -- checked across .py and .ipynb.
# The files stay in the working tree so any local notebook that used them still runs; they are
# simply not installed.
#
# Shipped in v0.1.0. Anyone who did `import utils` expecting EROTICA after installing from PyPI
# should use `from erotica.utils.utils import compare_datasets` instead.
py-modules = []

[tool.setuptools.packages.find]
include = ["erotica*"]
exclude = ["legacy*", "tests*", "notebooks*", "backups*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# tools/prototypes/ is excluded: they are throwaway sketches, and all 30 F821 (undefined-name)
# findings in this repository live there. The package itself, tests/ and tools/validation/ have
# ZERO undefined names -- checked, not assumed.
exclude = ["build", "dist", "legacy", "backups", "docs/_build", "data", "tools/prototypes"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) catches real bugs, pycodestyle (E/W) and isort (I) reproduce
# what black/isort/flake8 were configured to do. Widening the rule set on a codebase this size
# is its own change, with its own review.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # line length is enforced by the formatter, not the linter
  "B008",   # function call in default arg -- intentional for astropy units
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures after module-level setup and shadow names on purpose.
"tests/*" = ["E402", "F811"]
# Validation scripts are executable narratives; long module docstrings are the point.
"tools/validation/*" = ["E402"]
# E741 forbids `l` as a name because it looks like `1`. In this module `l` is GALACTIC
# LONGITUDE -- the standard IAU symbol, paired with `b` for latitude, used in every paper and
# every catalogue column this code reads. Renaming it to `gal_l` would make the code disagree
# with the literature it implements, which is a worse defect than the ambiguity the rule guards
# against. Scoped to this one file rather than disabled globally, so `l` as a loop variable is
# still caught everywhere else.
"erotica/analysis/dynamics.py" = ["E741"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "build/",
    "dist/",
    "legacy/",
    "tests/",
    "examples/",
    "docs/",
]
