[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erotica"
version = "0.1.0"
description = "EROTICA: Estimation, Recovery & Optimization, together with Inference, for Cluster Analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Lucas Pulgar-Escobar", email = "lescobar2019@udec.cl"},
]
keywords = ["astronomy", "clustering", "gaia", "star-clusters", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
# Floors match what actually resolves on the supported Pythons. They were previously numpy>=1.23,
# astropy>=6 and similar — versions with no build for 3.13+, so they advertised support that could
# not be installed. See environment.yml for the resolved set.
dependencies = [
  "hdbscan>=0.8.44",
  "optuna>=4.9",
  "numpy>=2.4",
  "scipy>=1.18",
  "pandas>=3.0",
  "astropy>=8",
  "scikit-learn>=1.9",
  "tqdm>=4.65",
  "matplotlib>=3.11",
  "dill>=0.3.8",
  "adjusttext>=1.4",
  "gaiadr3-zeropoint>=0.1.0",
]

[project.optional-dependencies]
# ruff replaces black + isort + flake8 (one tool, orders of magnitude faster). They were all
# declared here and run by no hook and no CI job; see .pre-commit-config.yaml. mypy stays
# declared but is not wired to a hook -- its config is strict and the package has never been run
# against it, so it needs a triaged pass rather than a surprise gate.
dev = [
  "pytest>=8",
  "pytest-cov>=4.0",
  "ruff>=0.14",
  "mypy>=1.5",
  "pre-commit>=3.0",
  "nbstripout>=0.7",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]
examples = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "ipywidgets>=8.0",
  "seaborn>=0.12",
]
bayes = [
  "pymc>=6",
  "arviz>=1",
  "xarray>=2023",
  # numpyro is the NUTS backend the validation sweeps use: measured 2.71x faster than the
  # default PyTensor NUTS on the unbinned EFF fit, with |d gamma| = 0.00006 between them.
  # Same algorithm, different substrate -- see tools/validation/pymc_blackjax_progress_bar_bug.md.
  "numpyro>=0.15",
  # blackjax is declared but is NOT currently usable as a nuts_sampler: it raises
  # TypeError: kernel() got an unexpected keyword argument 'progress_bar'. Traced to a
  # kwarg-ordering bug in pymc/sampling/jax.py that is still present on pymc main as of
  # 2026-08-02, and verified in the RELEASED 6.2.0 source, so upgrading does not fix it.
  # Upstream: pymc-devs/pymc#8367, fix pending in PR #8373. (An earlier version of this comment
  # cited #7049 — wrong: that is a 2023 issue about progress bars under pmap, closed in a week.)
  "blackjax>=1",
  "fast-histogram>=0.11",
  # ArviZ 1.x ships NO netCDF engine of its own. Without one, InferenceData.to_netcdf raises
  # "cannot write NetCDF files with format='NETCDF4' because none of the suitable backend
  # libraries (netCDF4, h5netcdf) are installed" -- which is every provenance sidecar and every
  # stored trace. This was added to environment.yml on 2026-08-02 and NOT here, and CI installs
  # from this file, so test-bayes was red ever since. Keep the two files in step.
  #
  # The [h5py] extra is load-bearing and a bare "h5netcdf" is NOT enough: h5py is an OPTIONAL
  # extra of h5netcdf, not a dependency, so `pip install h5netcdf` yields an engine with no
  # backend and the failure becomes "No module named 'h5py', backend not available". The first
  # version of this line omitted it and CI stayed red for exactly that reason.
  "h5netcdf[h5py]>=1.3",
]
asteca = [
  "asteca>=0.6",
]
selection = [
  "gaiaunlimited>=0.3",
  "hr-selection-function>=1.0",
]
paper = [
  "pymc>=6",
  "arviz>=1",
  "xarray>=2023",
  "numpyro>=0.15",
  "blackjax>=1",
  "asteca>=0.6",
  "seaborn>=0.12",
  "fast-histogram>=0.11",
  # Same reason as in [bayes], including the [h5py] extra: ArviZ 1.x ships no netCDF engine,
  # and h5netcdf without a backend is still no engine. This extra regenerates the paper
  # figures, so it hits the failure on the first fit.
  "h5netcdf[h5py]>=1.3",
]

[project.urls]
Homepage = "https://github.com/notluquis/erotica"
Repository = "https://github.com/notluquis/erotica"
Issues = "https://github.com/notluquis/erotica/issues"
Changelog = "https://github.com/notluquis/erotica/blob/main/CHANGELOG.md"

[tool.setuptools]
# NOT shipped: the five bare top-level shims (clustering, cluster_analysis, data_loader,
# data_preprocessor, utils). They were declared here, so `pip install erotica` dropped
# `utils.py`, `clustering.py` and `data_loader.py` UNNAMESPACED into site-packages -- and
# `utils` in particular is one of the most collision-prone names on PyPI. Installing a module
# called `utils` into a user's environment can shadow their own or another package's.
#
# They are 81 lines total and are pure re-export shims (`from erotica.utils.utils import
# compare_datasets`). Nothing in this repository imports them -- checked across .py and .ipynb.
# The files stay in the working tree so any local notebook that used them still runs; they are
# simply not installed.
#
# Shipped in v0.1.0. Anyone who did `import utils` expecting EROTICA after installing from PyPI
# should use `from erotica.utils.utils import compare_datasets` instead.
py-modules = []

[tool.setuptools.packages.find]
include = ["erotica*"]
exclude = ["legacy*", "tests*", "notebooks*", "backups*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# tools/prototypes/ is excluded: they are throwaway sketches, and all 30 F821 (undefined-name)
# findings in this repository live there. The package itself, tests/ and tools/validation/ have
# ZERO undefined names -- checked, not assumed.
exclude = ["build", "dist", "legacy", "backups", "docs/_build", "data", "tools/prototypes"]

[tool.ruff.lint]
# Start conservative: pyflakes (F) catches real bugs, pycodestyle (E/W) and isort (I) reproduce
# what black/isort/flake8 were configured to do. Widening the rule set on a codebase this size
# is its own change, with its own review.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # line length is enforced by the formatter, not the linter
  "B008",   # function call in default arg -- intentional for astropy units
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures after module-level setup and shadow names on purpose.
"tests/*" = ["E402", "F811"]
# Validation scripts are executable narratives; long module docstrings are the point.
"tools/validation/*" = ["E402"]
# E741 forbids `l` as a name because it looks like `1`. In this module `l` is GALACTIC
# LONGITUDE -- the standard IAU symbol, paired with `b` for latitude, used in every paper and
# every catalogue column this code reads. Renaming it to `gal_l` would make the code disagree
# with the literature it implements, which is a worse defect than the ambiguity the rule guards
# against. Scoped to this one file rather than disabled globally, so `l` as a loop variable is
# still caught everywhere else.
"erotica/analysis/dynamics.py" = ["E741"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "build/",
    "dist/",
    "legacy/",
    "tests/",
    "examples/",
    "docs/",
]
